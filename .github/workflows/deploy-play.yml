name: deploy-play-worker

on:
  workflow_dispatch: {}
  push:
    paths:
      - "workers/play.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-play.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy play worker (skip when no Cloudflare token)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN secret，跳过 Worker 部署（播放走官网外链兜底）"
            exit 0
          fi
          npx --yes wrangler@latest deploy \
            ${CF_ACCOUNT_ID:+--account-id "$CF_ACCOUNT_ID"}
